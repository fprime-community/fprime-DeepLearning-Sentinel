; The fprime-sentinel F' project, work item 9.
;
; F' is pinned at v4.3.0 (docs/DECISIONS.md D31). The framework checkout under
; lib/fprime is gitignored and rebuilt by scripts/fprime_setup.sh, so this file
; and the sources beside it are the only tracked parts of the project.
;
; Framework and autocoder unit tests are off, so `fprime-util check` runs this
; project's tests and not F's own -- the same choice, for the same reason, that
; F' makes in TestDeploymentsProject/settings.ini: "framework and autocoder UTs
; run in the framework CI jobs".
[fprime]
framework_path: lib/fprime
project_root: .
default_cmake_options: FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
